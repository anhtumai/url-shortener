[project]
name = "url-shortener"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "valkey>=6.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
